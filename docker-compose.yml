version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-0:
    build: ./server
    ports: ["6969:8080"]
    environment:
      NODE_ID: 0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  api-1:
    build: ./server
    ports: ["6968:8080"]
    environment:
      NODE_ID: 1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  api-2:
    build: ./server
    ports: ["6967:8080"]
    environment:
      NODE_ID: 2
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]

  worker-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    entrypoint: ["/bin/worker"]
    command: ["/bin/worker"]
    environment:
      WORKER_ID: worker1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    entrypoint: ["/bin/worker"]
    command: ["/bin/worker"]
    environment:
      WORKER_ID: worker2
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-3:
    build:
      context: ./server
      dockerfile: Dockerfile
    entrypoint: ["/bin/worker"]
    command: ["/bin/worker"]
    environment:
      WORKER_ID: worker3
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/url?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
